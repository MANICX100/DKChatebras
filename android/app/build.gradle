plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.cerebras.dkchatebras'
    compileSdk 37

    defaultConfig {
        applicationId 'ai.cerebras.dkchatebras'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures {
        buildConfig = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
